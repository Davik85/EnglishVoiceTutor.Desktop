<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Mobile app placeholder</title>
  <desc id="desc">A stylized phone placeholder for future Language Voice Tutor mobile app screenshots.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172a46"/>
      <stop offset="0.54" stop-color="#38506f"/>
      <stop offset="1" stop-color="#151b2a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#c8d7e6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="36" stdDeviation="34" flood-color="#000817" flood-opacity="0.44"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="250" cy="235" r="270" fill="#ffffff" opacity="0.08"/>
  <circle cx="1360" cy="980" r="330" fill="#ffffff" opacity="0.07"/>
  <g filter="url(#shadow)">
    <rect x="560" y="140" width="480" height="920" rx="78" fill="#101927"/>
    <rect x="600" y="208" width="400" height="770" rx="38" fill="url(#screen)"/>
    <rect x="715" y="166" width="170" height="20" rx="10" fill="#33445e"/>
    <rect x="662" y="305" width="276" height="62" rx="31" fill="#2f6f5e" opacity="0.9"/>
    <rect x="665" y="438" width="270" height="34" rx="17" fill="#143153" opacity="0.2"/>
    <rect x="665" y="504" width="205" height="34" rx="17" fill="#143153" opacity="0.16"/>
    <rect x="665" y="620" width="270" height="170" rx="32" fill="#2f6f5e" opacity="0.14"/>
    <circle cx="800" cy="705" r="58" fill="#2f6f5e" opacity="0.55"/>
    <rect x="715" y="848" width="170" height="48" rx="24" fill="#143153" opacity="0.22"/>
  </g>
  <text x="800" y="1125" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#fff" opacity="0.86">Replace with final mobile phone image</text>
</svg>

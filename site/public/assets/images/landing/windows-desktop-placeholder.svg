<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Windows desktop app placeholder</title>
  <desc id="desc">A stylized laptop placeholder for a future Language Voice Tutor desktop screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245f81"/>
      <stop offset="0.54" stop-color="#2f6f5e"/>
      <stop offset="1" stop-color="#142b4a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef9ff"/>
      <stop offset="1" stop-color="#b9d5ec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#00131f" flood-opacity="0.34"/>
